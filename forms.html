<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms | DaCodaHub Mobile Demo</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><div class="site-header__inner">DaCodaHub Mobile Demo</div></header><main><a class="home-link" href="index.html">← Back to Demo Home</a><h1>Forms and Keyboard</h1><p class="lead">Test common controls and mobile keyboard modes. Values are never sent or stored.</p><div class="status" role="status" data-environment-status>Checking environment…</div>
<form class="card stack" data-demo-form><div class="field"><label for="name">Display name</label><input id="name" name="name" type="text" placeholder="Casey Example" autocomplete="off"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="demo@example.com" autocomplete="off"></div><div class="field"><label for="phone">Telephone</label><input id="phone" name="phone" type="tel" placeholder="(360) 555-0100" autocomplete="off"></div><div class="field"><label for="password">Demo password</label><input id="password" name="password" type="password" placeholder="Not stored" autocomplete="new-password"></div><div class="field"><label for="number">Quantity</label><input id="number" name="number" type="number" min="0" max="99" placeholder="3"></div><div class="field"><label for="date">Test date</label><input id="date" name="date" type="date"></div><div class="field"><label for="theme">Theme</label><select id="theme" name="theme"><option value="">Choose a demo theme</option><option>Ocean</option><option>Forest</option><option>Slate</option></select></div>
<fieldset><legend>Demo options</legend><label class="choice"><input type="checkbox" name="options" value="navigation"> Navigation tests</label><label class="choice"><input type="checkbox" name="options" value="bridge"> Bridge tests</label></fieldset><fieldset><legend>Preferred layout</legend><label class="choice"><input type="radio" name="layout" value="compact"> Compact</label><label class="choice"><input type="radio" name="layout" value="comfortable"> Comfortable</label></fieldset><div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="Fictional demo notes only"></textarea></div><button type="submit">Submit demo form</button><div class="notice" role="status" tabindex="-1" data-form-message hidden></div></form>
</main><footer class="site-footer">Client-side form test; no data collection</footer><script src="js/app.js"></script></body></html>
